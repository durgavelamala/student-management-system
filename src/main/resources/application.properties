# ============================================================
# Student Management System - application configuration
# Values in ${NAME:default} form are read from environment
# variables; the part after ":" is used when the variable is missing.
# ============================================================

spring.application.name=student-management-system
server.port=${SERVER_PORT:8080}

# ---------- MySQL database ----------
# Local run  : DB_HOST=localhost (default)
# Docker run : DB_HOST=mysql (the Docker Compose service name)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" creates tables on first start and keeps existing data on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# Show our own error messages on the error page
server.error.include-message=always
