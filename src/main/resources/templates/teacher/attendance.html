<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: teacherSidebar}"></aside>

    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Attendance')}"></header>

        <div class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div th:if="${selectedSubject == null}" class="card empty-state">
                <i class="bi bi-book"></i>
                <p>No subjects found. Add subjects to the database first.</p>
            </div>

            <th:block th:if="${selectedSubject != null}">
                <!-- Choose subject and date -->
                <div class="card">
                    <form th:action="@{/teacher/attendance}" method="get" class="filter-bar">
                        <div class="form-group">
                            <label for="subjectId">Subject</label>
                            <select id="subjectId" name="subjectId" onchange="this.form.submit()">
                                <option th:each="sub : ${subjects}" th:value="${sub.id}"
                                        th:selected="${sub.id == selectedSubject.id}"
                                        th:text="${sub.code} + ' - ' + ${sub.name}">Subject</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" name="date" th:value="${selectedDate}" th:max="${today}">
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Load</button>
                    </form>
                </div>

                <!-- Mark attendance -->
                <div class="card">
                    <div class="card-header wrap">
                        <h3><i class="bi bi-calendar-check-fill"></i> Mark Attendance
                            <small class="muted" th:text="${selectedSubject.name} + ' • ' + ${#temporals.format(selectedDate, 'dd MMM yyyy')}"></small>
                        </h3>
                        <div class="toolbar">
                            <button type="button" class="btn btn-outline btn-sm" data-mark-all="PRESENT">
                                <i class="bi bi-check-all"></i> All Present</button>
                            <button type="button" class="btn btn-outline btn-sm" data-mark-all="ABSENT">
                                <i class="bi bi-x-lg"></i> All Absent</button>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(students)}" class="empty-state small">
                        <p>No students to mark.</p>
                    </div>

                    <form th:unless="${#lists.isEmpty(students)}" th:action="@{/teacher/attendance/save}" method="post">
                        <input type="hidden" name="subjectId" th:value="${selectedSubject.id}">
                        <input type="hidden" name="date" th:value="${selectedDate}">

                        <div class="table-wrapper">
                            <table class="table">
                                <thead>
                                <tr><th>Student</th><th>Student ID</th><th>Status</th></tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${students}">
                                    <td>
                                        <div class="person">
                                            <span class="avatar small" th:text="${s.initials}">AB</span>
                                            <strong th:text="${s.fullName}">Name</strong>
                                        </div>
                                    </td>
                                    <td th:text="${s.studentId}">STU001</td>
                                    <td>
                                        <!-- If no record exists yet, "Present" is pre-selected -->
                                        <div class="status-toggle">
                                            <label class="status present">
                                                <input type="radio" th:name="'status_' + ${s.id}" value="PRESENT"
                                                       th:checked="${attendanceMap[s.id] == null or attendanceMap[s.id]}">
                                                <span><i class="bi bi-check-circle"></i> Present</span>
                                            </label>
                                            <label class="status absent">
                                                <input type="radio" th:name="'status_' + ${s.id}" value="ABSENT"
                                                       th:checked="${attendanceMap[s.id] != null and !attendanceMap[s.id]}">
                                                <span><i class="bi bi-x-circle"></i> Absent</span>
                                            </label>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Attendance</button>
                        </div>
                    </form>
                </div>
            </th:block>

            <!-- Attendance percentage of every student -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="bi bi-percent"></i> Attendance Percentage (all subjects)</h3>
                    <span class="badge badge-info" th:text="'Class average: ' + ${#numbers.formatDecimal(overallAverage, 1, 1)} + '%'">avg</span>
                </div>
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                        <tr><th>Student</th><th>Present</th><th>Absent</th><th>Total</th><th>Percentage</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${summaries}">
                            <td>
                                <strong th:text="${row.student.fullName}">Name</strong>
                                <small class="muted" th:text="${row.student.studentId}"></small>
                            </td>
                            <td th:text="${row.presentClasses}">0</td>
                            <td th:text="${row.absentClasses}">0</td>
                            <td th:text="${row.totalClasses}">0</td>
                            <td>
                                <div class="progress"><div class="progress-bar" th:classappend="${row.low} ? 'low'"
                                     th:style="'width:' + ${row.percentage} + '%'"></div></div>
                                <small th:text="${#numbers.formatDecimal(row.percentage, 1, 1)} + '%'">0%</small>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
