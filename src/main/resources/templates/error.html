<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="center-page">
<div class="message-card">
    <i class="bi bi-exclamation-octagon-fill message-icon danger"></i>
    <h2>Something went wrong <span th:if="${status}" th:text="'(' + ${status} + ')'"></span></h2>
    <p class="muted" th:text="${message != null and message != ''} ? ${message} : 'The page could not be loaded.'">
        The page could not be loaded.</p>
    <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Back to dashboard</a>
</div>
</body>
</html>
