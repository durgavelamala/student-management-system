<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Announcements')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: studentSidebar}"></aside>

    <main class="main">
        <header th:replace="~{fragments/layout :: topbar('Announcements')}"></header>

        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h3><i class="bi bi-megaphone-fill"></i> All Announcements</h3>
                    <span class="badge badge-info" th:text="${#lists.size(announcements)}">0</span>
                </div>
                <div th:if="${#lists.isEmpty(announcements)}" class="empty-state">
                    <i class="bi bi-inbox"></i><p>No announcements yet.</p>
                </div>
                <div class="announcement-item" th:each="a : ${announcements}">
                    <h4 th:text="${a.title}">Title</h4>
                    <p th:text="${a.message}">Message</p>
                    <small class="muted">
                        <i class="bi bi-person"></i> <span th:text="${a.postedBy}">teacher</span> &nbsp;
                        <i class="bi bi-clock"></i> <span th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy, hh:mm a')}">date</span>
                    </small>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
